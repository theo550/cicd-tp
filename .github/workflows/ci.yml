name: CI
on:
  push:
    branch: master
  pull_request:
    branch: master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
      - name: Install dependencies
        run: npm ci
      - name: Tests
        run: npm test
      - name: Lint
        run: npm run lint
